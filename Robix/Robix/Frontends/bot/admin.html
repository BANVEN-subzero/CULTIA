<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CULTIA</title>
    <link rel="icon" type="image/png" href="../img/top.png">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- AOS Animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-green: #2d5a27;
            --accent-orange: #e67e22;
            --bg-light: #fdfaf5;
            --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            display: flex;
            min-height: 100vh;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            transition: margin-left 0.3s ease;
        }

        .stat-card {
            background: white;
            border-radius: 25px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: none;
            transition: var(--transition-smooth);
            height: 100%;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .animate-fade-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .animate-pulse {
            animation: pulse 2s infinite;
        }

        .btn-action {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            transform: scale(1.1);
        }

        .btn-edit {
            background: rgba(45, 90, 39, 0.1);
            color: var(--primary-green);
        }

        .btn-edit:hover {
            background: var(--primary-green);
            color: white;
        }

        .btn-delete {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
        }

        .btn-delete:hover {
            background: #dc3545;
            color: white;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .user-table-card {
            background: white;
            border-radius: 30px;
            padding: 2rem;
            box-shadow: 0 15px 45px rgba(0,0,0,0.05);
            margin-top: 2rem;
        }

        .table thead th {
            background: #f8f9fa;
            border: none;
            padding: 1rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .table tbody td {
            padding: 1.2rem 1rem;
            vertical-align: middle;
            border-bottom: 1px solid #f0f0f0;
        }

        .role-badge {
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .role-admin { background: rgba(45, 90, 39, 0.1); color: var(--primary-green); }
        .role-user { background: rgba(108, 117, 125, 0.1); color: #6c757d; }

        .btn-action {
            width: 35px;
            height: 35px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            border: none;
            font-size: 0.9rem;
        }

        .btn-delete { background: rgba(220, 53, 69, 0.1); color: #dc3545; }
        .btn-delete:hover { background: #dc3545; color: white; }

        .btn-edit { background: rgba(13, 110, 253, 0.1); color: #0d6efd; }
        .btn-edit:hover { background: #0d6efd; color: white; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .admin-welcome h1 {
            font-weight: 800;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .refresh-btn {
            background: white;
            border: 2px solid #f0f0f0;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: 700;
            transition: var(--transition-smooth);
        }

        .refresh-btn:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
        }

        .animate-count {
            font-weight: 800;
            font-size: 2rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="main-content">
        <div id="header-container"></div>

        <div class="container-fluid py-4">
            <div class="admin-header" data-aos="fade-down">
                <div class="admin-welcome">
                    <h1>Admin Dashboard</h1>
                    <p class="text-muted">Manage users, view statistics, and control the CULTIA platform.</p>
                </div>
                <button class="refresh-btn" onclick="loadAllData()">
                    <i class="fas fa-sync-alt me-2"></i>Refresh Data
                </button>
            </div>

            <div class="row g-4 mb-4">
                <div class="col-md-3" data-aos="zoom-in" data-aos-delay="100">
                    <div class="stat-card">
                        <div class="stat-icon bg-success bg-opacity-10 text-success">
                            <i class="fas fa-users"></i>
                        </div>
                        <p class="text-muted small fw-bold mb-1">TOTAL USERS</p>
                        <div class="animate-count" id="totalUsers">0</div>
                    </div>
                </div>
                <div class="col-md-3" data-aos="zoom-in" data-aos-delay="200">
                    <div class="stat-card">
                        <div class="stat-icon bg-primary bg-opacity-10 text-primary">
                            <i class="fas fa-award"></i>
                        </div>
                        <p class="text-muted small fw-bold mb-1">ACHIEVEMENTS</p>
                        <div class="animate-count" id="totalAchievements">0</div>
                    </div>
                </div>
                <div class="col-md-3" data-aos="zoom-in" data-aos-delay="300">
                    <div class="stat-card">
                        <div class="stat-icon bg-warning bg-opacity-10 text-warning">
                            <i class="fas fa-star"></i>
                        </div>
                        <p class="text-muted small fw-bold mb-1">TOTAL POINTS</p>
                        <div class="animate-count" id="totalPoints">0</div>
                    </div>
                </div>
                <div class="col-md-3" data-aos="zoom-in" data-aos-delay="400">
                    <div class="stat-card">
                        <div class="stat-icon bg-danger bg-opacity-10 text-danger">
                            <i class="fas fa-globe-africa"></i>
                        </div>
                        <p class="text-muted small fw-bold mb-1">TOP COUNTRY</p>
                        <div class="animate-count fs-4" id="topCountry">N/A</div>
                    </div>
                </div>
            </div>

            <div class="user-table-card" data-aos="fade-up">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold mb-0">User Management</h5>
                    <div class="search-box">
                        <input type="text" class="form-control rounded-pill" placeholder="Search users..." id="userSearch">
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table" id="usersTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Country</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-5">
                                    <div class="spinner-border text-success" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Role Modal -->
    <div class="modal fade" id="editRoleModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header border-0 p-4">
                    <h5 class="fw-bold">Update User Role</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <input type="hidden" id="editUserId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Select Role</label>
                        <select class="form-select rounded-pill p-3" id="roleSelect">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success rounded-pill px-4" onclick="saveUserRole()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/settingsManager.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 800, once: true });
            
            // Load Sidebar & Header
            fetch('includes/sidebar.html').then(r => r.text()).then(data => {
                document.getElementById('sidebar-container').innerHTML = data;
                // Add active class if link exists
                const currentPath = window.location.pathname.split('/').pop();
                const navLink = document.querySelector(`.nav-link[href="${currentPath}"]`);
                if (navLink) navLink.closest('.nav-item').classList.add('active');
            });

            fetch('includes/header.html').then(r => r.text()).then(data => {
                document.getElementById('header-container').innerHTML = data.replace('{{PAGE_TITLE}}', 'Admin Panel');
                if (window.settingsManager) window.settingsManager.initHeaderThemeToggle();
            });

            loadAllData();
        });

        async function loadAllData() {
            await Promise.all([
                loadStats(),
                loadUsers()
            ]);
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                if (data.success) {
                    animateValue("totalUsers", 0, data.stats.total_users, 1000);
                    animateValue("totalAchievements", 0, data.stats.total_achievements, 1000);
                    animateValue("totalPoints", 0, data.stats.total_points, 1000);
                    document.getElementById('topCountry').textContent = data.stats.countries[0]?.country || 'N/A';
                }
            } catch (e) {
                console.error('Error loading stats:', e);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users');
                const data = await response.json();
                if (data.success) {
                    renderUsers(data.users);
                }
            } catch (e) {
                console.error('Error loading users:', e);
            }
        }

        function renderUsers(users) {
            const body = document.getElementById('userTableBody');
            body.innerHTML = '';
            
            users.forEach((user, index) => {
                const row = document.createElement('tr');
                const date = new Date(user.created_at).toLocaleDateString();
                row.className = 'animate-fade-in';
                row.style.animationDelay = `${index * 0.05}s`;
                row.innerHTML = `
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-success bg-opacity-10 text-success p-2 me-3" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: 800;">
                                ${user.first_name.charAt(0)}
                            </div>
                            <span class="fw-bold">${user.first_name} ${user.last_name}</span>
                        </div>
                    </td>
                    <td>${user.email}</td>
                    <td><span class="role-badge role-${user.role}">${user.role.toUpperCase()}</span></td>
                    <td>${user.country}</td>
                    <td class="text-muted small">${date}</td>
                    <td>
                        <div class="d-flex gap-2">
                            <button class="btn-action btn-edit" onclick="editRole(${user.id}, '${user.role}')" title="Edit Role">
                                <i class="fas fa-user-tag"></i>
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteUser(${user.id})" title="Delete User">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function editRole(id, currentRole) {
            document.getElementById('editUserId').value = id;
            document.getElementById('roleSelect').value = currentRole;
            const modal = new bootstrap.Modal(document.getElementById('editRoleModal'));
            modal.show();
        }

        async function saveUserRole() {
            const id = document.getElementById('editUserId').value;
            const role = document.getElementById('roleSelect').value;
            
            try {
                const response = await fetch('/api/admin/user/role', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: id, role: role })
                });
                const data = await response.json();
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('editRoleModal')).hide();
                    loadUsers();
                    alert('Role updated successfully!');
                } else {
                    alert(data.message || 'Error updating role');
                }
            } catch (e) {
                alert('Error updating role');
            }
        }

        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user? This will remove all their achievements and progress.')) {
                try {
                    const response = await fetch(`/api/admin/user/${id}`, { method: 'DELETE' });
                    const data = await response.json();
                    if (data.success) {
                        loadAllData();
                        alert('User deleted successfully');
                    }
                } catch (e) {
                    alert('Error deleting user');
                }
            }
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            if (!obj) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start).toLocaleString();
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Simple Search Filter
        document.getElementById('userSearch').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#userTableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(term) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
